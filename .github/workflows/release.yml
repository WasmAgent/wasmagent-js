name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "packages/**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'WasmAgent/wasmagent-js'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      # Node 24 provides an npm new enough (>= 11.5.1) for OIDC trusted
      # publishing, which `changeset publish` invokes under the hood. We keep
      # NPM_TOKEN auth for now (works until npm's 2FA-token deprecation); this
      # only makes the runner OIDC-ready so the eventual token->OIDC switch is a
      # config change, not a toolchain upgrade. Requires per-package trusted
      # publishers configured on npmjs.com before dropping NPM_TOKEN.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Pre-publish provable-chain gate: prove the core → compliance → AEP
      # seam still holds on the freshly-built workspace BEFORE anything is
      # published to npm. A break here (a verified task can no longer become
      # signed, verifiable evidence) fails the release rather than shipping a
      # broken chain. Runs against workspace builds, not published versions.
      - name: Provable-chain pre-publish gate
        run: bun examples/integration-smoke/provable-chain.mjs

      - name: Set npm registry
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # BLOCKING pre-publish readiness gate: every public package must pass
      # metadata/dist/LICENSE/README/pack checks BEFORE anything reaches npm.
      # (The post-publish run below is kept as registry verification, but it
      # can no longer be the only line of defence.)
      - name: Publish readiness — all public packages (blocking)
        run: bun run publish:check

      # Pre-publish ownership snapshot for runtime provenance: records the
      # public workspace packages whose exact name@version is NOT yet on the
      # registry. Ordering is correct here — the Version Packages PR has
      # already merged by the time this workflow publishes, so workspace
      # versions ARE the versions about to publish, and the registry does not
      # serve them yet. Only these candidates may be attributed to this run.
      - name: Snapshot publish candidates (pre-publish ownership)
        run: node scripts/snapshot-release-candidates.mjs --out release-provenance/candidates.json

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@66d7d1ddafddf1ef45f98ee51a7496f9cdadb2f4
        with:
          version-script: bun run release:version
          publish-script: bun run release:publish
          commit-message: "chore: release packages"
          pr-title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Post-publish registry verification (non-blocking observation)
        # This is a POST-publish observation, not the pre-publish gate — the
        # blocking readiness check runs before changesets publish above.
        if: steps.changesets.outputs.published == 'true'
        continue-on-error: true
        run: bun run publish:check

      # Runtime release provenance (wasmagent-release-provenance/v1, schema
      # owned by WasmAgent/.github org contract / Gate O4): one artifact per
      # pre-publish candidate that the registry now actually serves, binding
      # source_sha, workflow content SHA, lock hash, toolchain, registry
      # integrity, run id and destination. The generator fails closed on
      # empty candidate set, candidates still missing after publish, count
      # mismatch, or duplicates — so provenance can only ever attribute
      # packages this run published.
      - name: Emit runtime release provenance
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/generate-release-provenance.mjs --candidates release-provenance/candidates.json --out release-provenance

      - name: Upload release provenance artifact
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-provenance
          path: release-provenance/
          if-no-files-found: error


      - name: Deprecate legacy model-* shims
        if: steps.changesets.outputs.published == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Deprecate the 8 model-* shim packages that now re-export from
          # @wasmagent/models. Only deprecates versions that exist on npm;
          # skips with a warning if the package/version was never published.
          SHIMS="
            @wasmagent/model-anthropic
            @wasmagent/model-openai
            @wasmagent/model-deepseek
            @wasmagent/model-doubao
            @wasmagent/model-minimax
            @wasmagent/model-moonshot
            @wasmagent/model-qwen
            @wasmagent/model-zhipu
          "
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          for pkg in $SHIMS; do
            msg="Deprecated: use @wasmagent/models instead. See https://github.com/WasmAgent/wasmagent-js/issues/123"
            if npm deprecate "$pkg" "$msg" 2>&1; then
              echo "✓ deprecated $pkg"
            else
              echo "⚠ could not deprecate $pkg (may not be published yet — will retry on next release)"
            fi
          done
      - name: Create GitHub Release (aggregate)
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Parse published packages from changesets output
          PACKAGES='${{ steps.changesets.outputs.publishedPackages }}'
          # Get the core version (representative of the release).
          # The current action major no longer emits a parseable
          # publishedPackages blob (observed: a blank value) — it creates
          # the per-package GitHub Releases itself, so when nothing parses
          # we skip the aggregate release instead of crashing.
          CORE_VERSION=$(echo "$PACKAGES" | python3 -c "
          import sys, json
          try:
              pkgs = json.load(sys.stdin)
          except Exception:
              pkgs = []
          core = next((p for p in pkgs if p['name'] == '@wasmagent/core'), pkgs[0] if pkgs else None)
          print(core['version'] if core else 'unknown')
          ")
          if [ "$CORE_VERSION" = "unknown" ] || [ -z "$CORE_VERSION" ]; then
            echo "No publishedPackages JSON from the changesets action (per-package Releases were created by the action itself) — skipping aggregate release."
            exit 0
          fi
          TAG="v${CORE_VERSION}"
          # Rapid-major-bump guard (#244): refuse a NEW major aggregate tag
          # within 24h of the previous distinct major (the 2026-07-23
          # v2→v3-in-3-minutes incident). Already-existing releases skip
          # via the idempotency guard below before this matters.
          if node scripts/check-rapid-major-bump.mjs "$TAG"; then
            echo "rapid-major guard passed for $TAG"
          else
            echo "✗ $TAG blocked by scripts/check-rapid-major-bump.mjs — see docs/strategy/release-cadence-log.md"
            exit 1
          fi
          # Idempotency guard: when core-four packages publish in batches
          # (e.g. core+mcp-firewall first, aep+compliance to align after),
          # the second Release run targets the same aggregate tag. Skip if
          # the release already exists rather than failing with HTTP 422.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping aggregate create."
            exit 0
          fi
          # Extract [Unreleased] section from CHANGELOG for release notes
          NOTES=$(python3 -c "
          import re
          content = open('CHANGELOG.md').read()
          # Find the first versioned section (just published)
          m = re.search(r'^## \[' + re.escape('${CORE_VERSION}') + r'\](.*?)(?=^## \[|\Z)', content, re.M | re.S)
          if m:
              print(m.group(1).strip()[:10000])
          else:
              print('See CHANGELOG.md for details.')
          ")
          gh release create "$TAG" \
            --title "wasmagent $TAG" \
            --notes "$NOTES" \
            --latest

          # Refresh the GOVERNANCE current-state table (#243) so the
          # published metrics stay tied to the release that changed them.
          # Informational only — never block the release on a docs commit.
          if node scripts/update-governance-current-state.mjs "${CORE_VERSION}"; then
            git push origin "HEAD:${{ github.ref_name }}" || echo "⚠ governance commit push skipped"
          else
            echo "⚠ governance refresh skipped"
          fi
